name: Build Smart Watch Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Board Core
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      # Copies local dependencies from the repository to the global Arduino libraries folder
      - name: Copy Local Libraries (if present)
        run: |
          mkdir -p ~/Arduino/libraries
          if [ -d "libraries" ]; then
            cp -r libraries/* ~/Arduino/libraries/
          fi
          if [ -d "examples/Arduino-v3.2.0/libraries" ]; then
            cp -r examples/Arduino-v3.2.0/libraries/* ~/Arduino/libraries/
          fi

      # Debugging step to display exactly what files are in the runner workspace
      - name: Debug Workspace Structure
        run: |
          echo "==== Current Directory Path ===="
          pwd
          echo "==== Directory Contents ===="
          ls -R
          echo "==== All .ino files found ===="
          find . -name "*.ino"

      # Dynamically finds the main sketch directory and compiles it
      - name: Compile Sketch
        run: |
          # 1. Search for a .ino file that is NOT inside a "libraries" or "examples" folder
          SKETCH_PATH=$(find . -name "*.ino" -not -path "*/libraries/*" -not -path "*/examples/*" -not -path "*/.*" -print -quit)
          
          # 2. If not found, fall back to any .ino file in the repository
          if [ -z "$SKETCH_PATH" ]; then
            SKETCH_PATH=$(find . -name "*.ino" -not -path "*/.*" -print -quit)
          fi
          
          # 3. If still not found, throw an error
          if [ -z "$SKETCH_PATH" ]; then
            echo "Error: No .ino file found in the workspace!"
            exit 1
          fi
          
          SKETCH_DIR=$(dirname "$SKETCH_PATH")
          echo "Found sketch file: $SKETCH_PATH"
          echo "Compiling sketch directory: $SKETCH_DIR"
          
          # Compile the dynamically discovered directory
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3 \
            --board-options "PSRAM=opi,FlashSize=16M" \
            --output-dir ./build \
            "$SKETCH_DIR"

      - name: Upload Bin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartwatch-firmware
          path: ./build/*.bin
