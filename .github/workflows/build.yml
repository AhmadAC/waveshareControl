name: Build Smart Watch Firmware

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 Board Core
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          
          # PIN ESP32 CORE TO 2.0.17 to ensure compatibility with Waveshare's proprietary hardware libraries
          arduino-cli core install esp32:esp32@2.0.17 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Prepare Libraries (Waveshare + LVGL)
        run: |
          mkdir -p ~/Arduino/libraries
          
          # 1. Clone official Waveshare repository
          echo "Cloning official Waveshare repository..."
          git clone --depth 1 https://github.com/waveshareteam/ESP32-S3-Touch-AMOLED-2.06.git /tmp/waveshare_repo
          
          HEADER_PATH=$(find /tmp/waveshare_repo -type f -name "Arduino_DriveBus_Library.h" -print -quit)
          
          if [ -n "$HEADER_PATH" ]; then
            # Navigate up to the folder that holds all of Waveshare's provided libraries
            if [[ "$HEADER_PATH" == */src/* ]]; then
              LIB_ROOT=$(dirname $(dirname "$HEADER_PATH"))
            else
              LIB_ROOT=$(dirname "$HEADER_PATH")
            fi
            LIBRARIES_DIR=$(dirname "$LIB_ROOT")
            
            echo "Copying Waveshare hardware libraries from $LIBRARIES_DIR..."
            cp -r "$LIBRARIES_DIR"/* ~/Arduino/libraries/
          else
            echo "Error: Arduino_DriveBus_Library.h not found in official repo!"
            exit 1
          fi
          
          # 2. Delete Waveshare's bundled LVGL to prevent version mixing errors
          echo "Purging bundled LVGL..."
          rm -rf ~/Arduino/libraries/lvgl
          
          # 3. Install clean LVGL 9.1.0 (to match SquareLine Studio 1.5.0)
          echo "Installing clean LVGL 9.1.0..."
          arduino-cli lib update-index
          arduino-cli lib install "lvgl@9.1.0"
          
          # 4. Setup the lv_conf.h configuration file
          echo "Setting up lv_conf.h..."
          cp ~/Arduino/libraries/lvgl/lv_conf_template.h ~/Arduino/libraries/lv_conf.h
          
          sed -i 's/#if 0/#if 1/g' ~/Arduino/libraries/lv_conf.h
          sed -i 's/#define LV_COLOR_DEPTH.*/#define LV_COLOR_DEPTH 16/g' ~/Arduino/libraries/lv_conf.h
          sed -i 's/#define LV_USE_USER_DATA.*/#define LV_USE_USER_DATA 1/g' ~/Arduino/libraries/lv_conf.h
          sed -i 's/#define LV_USE_DEMOS.*/#define LV_USE_DEMOS 0/g' ~/Arduino/libraries/lv_conf.h
          
          # Enable required Montserrat fonts for SquareLine Studio UI
          sed -i 's/#define LV_FONT_MONTSERRAT_12 0/#define LV_FONT_MONTSERRAT_12 1/g' ~/Arduino/libraries/lv_conf.h
          sed -i 's/#define LV_FONT_MONTSERRAT_16 0/#define LV_FONT_MONTSERRAT_16 1/g' ~/Arduino/libraries/lv_conf.h
          sed -i 's/#define LV_FONT_MONTSERRAT_18 0/#define LV_FONT_MONTSERRAT_18 1/g' ~/Arduino/libraries/lv_conf.h
          sed -i 's/#define LV_FONT_MONTSERRAT_20 0/#define LV_FONT_MONTSERRAT_20 1/g' ~/Arduino/libraries/lv_conf.h
          sed -i 's/#define LV_FONT_MONTSERRAT_22 0/#define LV_FONT_MONTSERRAT_22 1/g' ~/Arduino/libraries/lv_conf.h
          sed -i 's/#define LV_FONT_MONTSERRAT_24 0/#define LV_FONT_MONTSERRAT_24 1/g' ~/Arduino/libraries/lv_conf.h
          sed -i 's/#define LV_FONT_MONTSERRAT_26 0/#define LV_FONT_MONTSERRAT_26 1/g' ~/Arduino/libraries/lv_conf.h

      - name: Copy Local Libraries (if present)
        run: |
          if [ -d "libraries" ] && [ "$(ls -A libraries 2>/dev/null)" ]; then
            cp -r libraries/* ~/Arduino/libraries/
          fi

      - name: Flatten Subdirectories for Arduino CLI
        run: |
          # Arduino CLI does not natively compile .c files inside subdirectories 
          SKETCH_PATH=$(find . -name "*.ino" -not -path "*/libraries/*" -not -path "*/examples/*" -not -path "*/.*" -print -quit)
          
          if [ -z "$SKETCH_PATH" ]; then
            SKETCH_PATH=$(find . -name "*.ino" -not -path "*/.*" -print -quit)
          fi
          
          if [ -n "$SKETCH_PATH" ]; then
            SKETCH_DIR=$(dirname "$SKETCH_PATH")
            
            if [ -d "$SKETCH_DIR/fonts" ]; then
              echo "Flattening 'fonts' directory into sketch root..."
              mv "$SKETCH_DIR/fonts/"* "$SKETCH_DIR/"
              rmdir "$SKETCH_DIR/fonts"
            fi
            
            if [ -d "$SKETCH_DIR/assets" ]; then
              echo "Flattening 'assets' directory into sketch root..."
              mv "$SKETCH_DIR/assets/"* "$SKETCH_DIR/" 2>/dev/null || true
              rmdir "$SKETCH_DIR/assets" 2>/dev/null || true
            fi
          fi

      - name: Patch Legacy LVGL Includes in Sketch
        run: |
          SKETCH_PATH=$(find . -name "*.ino" -not -path "*/libraries/*" -not -path "*/examples/*" -not -path "*/.*" -print -quit)
          if [ -z "$SKETCH_PATH" ]; then
            SKETCH_PATH=$(find . -name "*.ino" -not -path "*/.*" -print -quit)
          fi
          
          if [ -n "$SKETCH_PATH" ]; then
            echo "Patching $SKETCH_PATH to remove obsolete lv_demos.h..."
            # Comment out legacy demo includes
            sed -i 's/#include <demos\/lv_demos.h>/\/\/ #include <demos\/lv_demos.h>/g' "$SKETCH_PATH"
            sed -i 's/#include "demos\/lv_demos.h"/\/\/ #include "demos\/lv_demos.h"/g' "$SKETCH_PATH"
            
            # Comment out lingering demo calls to prevent undefined reference errors
            sed -i 's/lv_demo_benchmark();/\/\/ lv_demo_benchmark();/g' "$SKETCH_PATH"
            sed -i 's/lv_demo_widgets();/\/\/ lv_demo_widgets();/g' "$SKETCH_PATH"
            sed -i 's/lv_demo_music();/\/\/ lv_demo_music();/g' "$SKETCH_PATH"
          fi

      - name: Compile Sketch
        run: |
          SKETCH_PATH=$(find . -name "*.ino" -not -path "*/libraries/*" -not -path "*/examples/*" -not -path "*/.*" -print -quit)
          
          if [ -z "$SKETCH_PATH" ]; then
            SKETCH_PATH=$(find . -name "*.ino" -not -path "*/.*" -print -quit)
          fi
          
          if [ -z "$SKETCH_PATH" ]; then
            echo "Error: No .ino file found in the workspace!"
            exit 1
          fi
          
          SKETCH_DIR=$(dirname "$SKETCH_PATH")
          echo "Found sketch file: $SKETCH_PATH"
          echo "Compiling sketch directory: $SKETCH_DIR"
          
          if [ ! -f "$SKETCH_DIR/pin_config.h" ]; then
            echo "pin_config.h not found. Generating default ESP32-S3-Touch-AMOLED-2.06 configuration..."
            {
              echo "#pragma once"
              echo "#define XPOWERS_CHIP_AXP2101"
              echo ""
              echo "#define LCD_WIDTH 410"
              echo "#define LCD_HEIGHT 502"
              echo ""
              echo "#define LCD_CS 38"
              echo "#define LCD_SCLK 47"
              echo "#define LCD_SDIO0 18"
              echo "#define LCD_SDIO1 17"
              echo "#define LCD_SDIO2 16"
              echo "#define LCD_SDIO3 21"
              echo "#define LCD_RST 39"
              echo "#define LCD_RESET 39"
              echo ""
              echo "#define IIC_SDA 12"
              echo "#define IIC_SCL 11"
              echo "#define TP_INT 10"
              echo "#define RTC_INT 13"
              echo "#define IMU_INT 40"
              echo ""
              echo "#define I2S_MCK_IO 4"
              echo "#define I2S_BCK_IO 5"
              echo "#define I2S_DI_IO 7"
              echo "#define I2S_WS_IO 6"
              echo "#define I2S_DO_IO 8"
              echo ""
              echo "#define BAT_ADC 14"
              echo "#define PWR_ON 15"
            } > "$SKETCH_DIR/pin_config.h"
          fi
          
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M \
            --export-binaries \
            --output-dir ./build \
            "$SKETCH_DIR"

      - name: Upload Bin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartwatch-firmware
          path: ./build/*.bin
